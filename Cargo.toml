[workspace]
members = ["crates/reqo-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
reqo-core = { path = "crates/reqo-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
ureq = "3"

[profile.dev.package."*"]
opt-level = 2
